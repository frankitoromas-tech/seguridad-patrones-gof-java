name: Java 17 CI Build & Pattern Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile All Java Sources
      run: |
        mkdir -p bin
        find src -name "*.java" > sources.txt
        javac -d bin -sourcepath src @sources.txt

    - name: Execute GoF Design Patterns Audit Suite
      run: |
        java -cp bin com.seguridad.principal.EjecutorPruebasAuditoria
