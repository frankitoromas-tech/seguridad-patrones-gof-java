name: Java 17 CI Build & GoF Patterns Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run JUnit 5 Automated Test Suite
      run: mvn clean test -B

    - name: Execute Audit Suite & Verify Compilation
      run: |
        mvn compile -B
        java -cp target/classes com.seguridad.principal.EjecutorPruebasAuditoria
